# =============================================================================
#  Nginx Config — SignageCMS Production
#
#  Place at: /etc/nginx/sites-available/cms
#  Enable:   sudo ln -s /etc/nginx/sites-available/cms /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
#
#  Assumes:
#    - Backend PM2 cluster listening on 127.0.0.1:3000
#    - Media storage at /cms/storage/
#    - SSL cert managed by Certbot (Let's Encrypt)
# =============================================================================

upstream cms_backend {
    # least_conn balances across PM2 workers on the same port (PM2 handles it
    # internally, but upstream block also enables keepalive to Node.js)
    least_conn;
    server 127.0.0.1:3000;
    keepalive 64;
}

# ─── Redirect HTTP → HTTPS ────────────────────────────────────────────────────
server {
    listen 80;
    server_name dms.saigontech.net www.dms.saigontech.net;
    return 301 https://$host$request_uri;
}

# ─── Main HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name dms.saigontech.net www.dms.saigontech.net;

    # ── SSL (managed by Certbot) ──────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/dms.saigontech.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dms.saigontech.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers (supplementing helmet.js) ────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Upload size (match backend MAX_VIDEO_SIZE_MB) ─────────────────────────
    client_max_body_size 2G;

    # ── Serve media files DIRECTLY — bypass Node.js entirely ─────────────────
    # Node.js validates the token and sets X-Accel-Redirect header pointing here.
    # Nginx serves the file with zero-copy sendfile + browser caching.
    location /internal/storage/ {
        internal;                          # only accessible via X-Accel-Redirect
        alias /cms/storage/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Accept-Ranges bytes;    # allow video seeking via Range requests
    }

    # ── WebSocket (Socket.IO) ─────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://cms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ── API + SPA fallback ────────────────────────────────────────────────────
    location / {
        proxy_pass http://cms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeout for large video uploads
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Disable buffering for SSE / streaming responses
        proxy_buffering off;
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        image/svg+xml;
    gzip_min_length 1024;
}
