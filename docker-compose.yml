version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: signage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: signage_cms_dev
      POSTGRES_USER: signage_dev
      POSTGRES_PASSWORD: dev_password123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signage_dev -d signage_cms_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: signage-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: signage-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@signage.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ── Backend (Node.js) ──────────────────────────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signage-app
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      NGINX_ACCEL: "true"
      NGINX_ACCEL_PREFIX: /internal/storage
      STORAGE_ROOT: /app/storage
      MEDIA_DIR: /app/storage/media
      THUMBNAIL_DIR: /app/storage/thumbnails
      UPLOAD_TEMP_DIR: /app/storage/temp
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Không expose port ra ngoài — chỉ Nginx mới gọi được
    expose:
      - "3000"

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: signage-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/app/frontend/dist:ro        # frontend build output
      - storage_data:/app/storage:ro                 # media files (read-only)
      - ./docker/ssl:/etc/ssl:ro                     # SSL certs
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  storage_data:
