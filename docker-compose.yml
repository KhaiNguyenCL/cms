version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: signage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: signage_cms_prod
      POSTGRES_USER: signage_prod
      POSTGRES_PASSWORD: bc8040131b33c65ea6115d6645c16547
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signage_prod -d signage_cms_prod -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: signage-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass 1cdfa669a251f974c1dbe48c9aa1ec93
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1cdfa669a251f974c1dbe48c9aa1ec93", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Node.js) ────────────────────────────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dms-signage-backend:latest
    container_name: signage-app
    restart: unless-stopped
    env_file: ./backend/.env.production
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"

  # ── Nginx + Frontend (baked in) ──────────────────────────────────────────────
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: dms-signage-nginx:latest
    container_name: signage-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro   # config (có domain)
      - storage_data:/app/storage:ro                         # media files
      - ./docker/ssl:/etc/ssl:ro                             # SSL certs từ host
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  storage_data:
