# ============================================================
#  SignageCMS — Nginx Production Config
#  X-Accel-Redirect: Node.js validate signed token, Nginx serve file.
#  Luồng: Client → Nginx → Node.js (token check) → X-Accel-Redirect → Nginx serve
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript
        application/x-javascript image/svg+xml;

    # ── Upstream: Node.js backend ──────────────────────────────────────────────
    upstream backend {
        server app:3000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name dms.saigontech.net;

        ssl_certificate     /etc/ssl/certs/cert.pem;      # <-- đường dẫn cert
        ssl_certificate_key /etc/ssl/private/key.pem;     # <-- đường dẫn key
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # ── Upload limit (video ≤2GB) ──────────────────────────────────────────
        client_max_body_size 2100m;

        # ── Frontend SPA ──────────────────────────────────────────────────────
        root  /app/frontend/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # Assets hash trong tên file — cache lâu hơn
        location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|svg)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ── API routes → Node.js ───────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Timeout lớn cho upload video
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;
            proxy_connect_timeout 10s;
        }

        # ── WebSocket (Socket.IO) ──────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
        }

        # ── Internal storage (X-Accel-Redirect target) ────────────────────────
        # Node.js trả X-Accel-Redirect: /internal/storage/media/uuid.mp4
        # Nginx serve file từ /app/storage/ mà KHÔNG qua Node.js event loop.
        # `internal` = không accessible trực tiếp từ client.
        location ^~ /internal/storage/ {
            internal;
            alias /app/storage/;

            # Video pseudo-streaming (seek support)
            mp4;
            mp4_buffer_size     1m;
            mp4_max_buffer_size 5m;

            add_header Accept-Ranges bytes;
            expires 1h;
        }
    }
}
